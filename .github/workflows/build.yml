name: Build

on: [pull_request]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Dependences
      run: |
        pod repo update
        pod install
    - name: Build
      run: xcodebuild -workspace Rectangle.xcworkspace -scheme Rectangle
      
